[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vipii"
version = "0.2.0"
description = "Presidio-powered Vietnamese PII detection with structured and NER recognizers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "vipii contributors" }
]
keywords = ["pii", "vietnamese", "privacy", "redaction", "nlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "presidio-analyzer>=2.2.359,<3",
  "presidio-anonymizer>=2.2.359,<3",
  "underthesea>=6.0.0",
]

[project.optional-dependencies]
ner = ["torch>=2.0.0", "transformers>=4.40.0"]
spark = ["pyspark>=3.5.0,<4.0.0"]
dev = ["pytest>=8.0", "ruff>=0.5.0"]

[project.urls]
Homepage = "https://github.com/hmtrii/vipii"
Repository = "https://github.com/hmtrii/vipii"
Issues = "https://github.com/hmtrii/vipii/issues"

[project.scripts]
vipii = "vipii.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vipii"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
